spring:
  application:
    name: yms-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yms}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456a@}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    repair-on-migrate: true
    # This database has V7 applied, but that legacy migration file is absent from this checkout.
    # Ignore the missing applied record while keeping checksum validation for resolved migrations.
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: yms-gps-persistence
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

yms:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-please-use-at-least-32-characters}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
  qr:
    hmac-secret: ${QR_HMAC_SECRET:${JWT_SECRET:dev-only-change-me-please-use-at-least-32-characters}}
  storage:
    local-path: ${STORAGE_PATH:./data/contracts}
    invoice-path: ${INVOICE_STORAGE_PATH:./data/invoices}
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:yms-minio}
      secret-key: ${MINIO_SECRET_KEY:yms-minio-change-me}
      bucket: ${MINIO_BUCKET:yms-signatures}
  tracking:
    enabled: ${TRACKING_ENABLED:true}
    mqtt:
      broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
      client-id: ${MQTT_CLIENT_ID:yms-gps-ingestion}
      topic: ${MQTT_GPS_TOPIC:yms/gps/+}
    retention-days: 90
    postgis-enabled: ${POSTGIS_ENABLED:false}
  kafka:
    topic: ${GPS_KAFKA_TOPIC:yms.gps}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  finance:
    time-zone: Asia/Ho_Chi_Minh
    interest-cron: ${FINANCE_INTEREST_CRON:0 5 0 * * *}
    invoice-overdue-cron: ${FINANCE_INVOICE_OVERDUE_CRON:0 15 0 * * *}
    dashboard-publish-ms: ${FINANCE_DASHBOARD_PUBLISH_MS:30000}
    e-invoice:
      enabled: ${E_INVOICE_ENABLED:false}
      base-url: ${E_INVOICE_BASE_URL:}
      api-key: ${E_INVOICE_API_KEY:}

logging:
  level:
    com.yms: INFO
    org.springframework.security: INFO

spring:
  datasource:
    url: jdbc:h2:mem:yms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

yms:
  tracking:
    enabled: false
    postgis-enabled: false
  security:
    jwt-secret: test-secret-key-at-least-32-characters-long
    expiration-seconds: 3600
  qr:
    hmac-secret: test-qr-secret-key-at-least-32-characters
  storage:
    local-path: ./target/test-contracts
